services:
  ai-app-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-app-builder-open:latest
    container_name: ai-app-builder-open
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - ORCHESTRATOR_MODE=${ORCHESTRATOR_MODE:-local}
      - SANDBOX_PROVIDER=${SANDBOX_PROVIDER:-local}
      - E2B_API_KEY=${E2B_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-16384}
      - TELNYX_API_KEY=${TELNYX_API_KEY:-}
      - TELNYX_MODEL=${TELNYX_MODEL:-zai-org/GLM-5.3-Flash}
      - TELNYX_BASE_URL=${TELNYX_BASE_URL:-https://api.telnyx.com/v2/ai/openai}
      - TELNYX_MAX_TOKENS=${TELNYX_MAX_TOKENS:-16384}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://vibecode-spzy.onrender.com}
      - TOTALUM_VCAAS_API_KEY=${TOTALUM_VCAAS_API_KEY:-local-orchestrator-active}
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
