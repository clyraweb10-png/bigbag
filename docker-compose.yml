services:
  ai-app-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-app-builder-open:latest
    container_name: ai-app-builder-open
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - ORCHESTRATOR_MODE=${ORCHESTRATOR_MODE:-local}
      - SANDBOX_PROVIDER=${SANDBOX_PROVIDER:-local}
      - E2B_API_KEY=${E2B_API_KEY:-}
      - ABOVE_API_KEY=${ABOVE_API_KEY:-}
      - ABOVE_BASE_URL=${ABOVE_BASE_URL:-https://api.above.dev/v1}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - TENANT_COOKIE_SECRET=${TENANT_COOKIE_SECRET:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://vibecode-spzy.onrender.com}
      - TOTALUM_VCAAS_API_KEY=${TOTALUM_VCAAS_API_KEY:-local-orchestrator-active}
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
